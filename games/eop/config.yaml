# games/eop/config.yaml
# Empire of Praxia tenant
#
# ONBOARDING CHECKLIST
# 1. Create Discord server + roles/channels matching CoA layout
# 2. Fill guild_id + all channel/role IDs below (0 = inactive / skip)
# 3. Fill games/eop/seed/items.py (+ monsters.py for scramble hints)
# 4. Seed DB:  cd starlight_v2 && python -m database.seed_cli --game eop
# 5. Set assets.github_* (+ base_path assets/empireoffraxia) if images are hosted
# 6. Restart bot — tenant loads when guild_id != 0
#
# Set guild_id to 0 to skip this tenant until the EoP server is ready.

